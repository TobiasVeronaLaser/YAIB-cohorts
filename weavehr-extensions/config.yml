# Configuration of the concepts loaded from WeavEHR (Python/src/weavehr.py), the counterpart of ricu-extensions/.
#
# concepts: YAIB concept name -> WeavEHR concept (or a list whose rows are pooled). Time series are aggregated
#   per time bin (aggregate, default: median); static: true marks per-stay concepts (ricu target id_tbl), which
#   take the last value recorded up to the end of the stay; text: true takes the text value.
#   The outcomes los_icu, death_icu, aki and sep3 are defined in Python/src/weavehr.py.

concepts:
  alb: {weavehr: albumin}
  alp: {weavehr: alkaline_phosphatase}
  alt: {weavehr: alanine_aminotransferase}
  ast: {weavehr: aspartate_aminotransferase}
  be: {weavehr: base_excess}
  bicar: {weavehr: bicarbonate}
  bili: {weavehr: total_bilirubin}
  bili_dir: {weavehr: bilirubin_direct}
  bnd: {weavehr: band_form_neutrophils}
  bun: {weavehr: blood_urea_nitrogen}
  ca: {weavehr: calcium}
  cai: {weavehr: calcium_ionized}
  ck: {weavehr: creatine_kinase}
  ckmb: {weavehr: creatine_kinase_MB}
  cl: {weavehr: chloride}
  crea: {weavehr: creatinine}
  crp: {weavehr: C_reactive_protein}
  dbp: {weavehr: diastolic_blood_pressure}
  fgn: {weavehr: fibrinogen}
  fio2: {weavehr: fraction_of_inspired_oxygen}
  glu: {weavehr: glucose}
  hgb: {weavehr: hemoglobin}
  hr: {weavehr: heart_rate}
  inr_pt: {weavehr: prothrombin_time_international_normalized_ratio}
  k: {weavehr: potassium}
  lact: {weavehr: lactate}
  lymph: {weavehr: lymphocytes}
  map: {weavehr: mean_arterial_pressure}
  mch: {weavehr: mean_corpuscular_hemoglobin}
  mchc: {weavehr: mean_corpuscular_hemoglobin_concentration}
  mcv: {weavehr: mean_corpuscular_volume}
  methb: {weavehr: methemoglobin}
  mg: {weavehr: magnesium}
  na: {weavehr: sodium}
  neut: {weavehr: neutrophils}
  o2sat: {weavehr: [oxygen_saturation, arterial_oxygen_saturation]}
  pco2: {weavehr: CO2_partial_pressure}
  ph: {weavehr: pH_of_blood}
  phos: {weavehr: phosphate}
  plt: {weavehr: platelet_count}
  po2: {weavehr: O2_partial_pressure}
  ptt: {weavehr: partial_thromboplastin_time}
  resp: {weavehr: respiratory_rate}
  sbp: {weavehr: systolic_blood_pressure}
  temp: {weavehr: temperature}
  tnt: {weavehr: troponin_t}
  urine: {weavehr: urine_output, aggregate: sum}
  wbc: {weavehr: white_blood_cell_count}
  age: {weavehr: patient_age, static: true}
  sex: {weavehr: patient_sex, static: true, text: true}
  height: {weavehr: patient_height, static: true}
  weight: {weavehr: patient_weight, static: true}

# sources: the WeavEHR datasets (--src) a project can be built for, with WeavEHR's own configs. The *-ricu
#   datasets extend a dataset with ricu 0.6.3's mappings where WeavEHR intentionally differs from ricu (see their
#   READMEs in WeavEHR), for comparisons with the cohorts extracted with ricu. Per dataset:
#   family: dataset family (eicu, mimic-iv, hirid, aumc); the task scripts choose dataset-specific criteria by it,
#     so demos and *-ricu datasets follow their dataset.
#   stay_id: the column identifying ICU stays in the extraction output, or subject_id where a subject is one stay.
#   icu_admission, icu_discharge: events (<table>/<event>) whose earliest and latest time per stay are the ICU
#     admission and discharge.
#   death_icu: events marking an ICU death, only those whose text_value is `text_value` if given; timed at the
#     event, or at the stay's last event matching `time_from` (events, code regex).
#   hospital_id: the hospital of each stay, as <table>/<event>/<extension column>, or a constant. Only the eICU
#     criteria use it.
# The definitions follow ricu (and YAIB's ricu-extensions) as noted per dataset.

sources:
  mimic-iv: &mimic-iv
    family: mimic-iv
    stay_id: stay_id
    icu_admission: icustay/icu_admission
    icu_discharge: icustay/icu_discharge
    # a death recorded within the stay (ricu-extensions: an in-hospital death whose last ward was an ICU)
    death_icu: {events: "*/MEDS_DEATH"}
    hospital_id: 1  # as ricu-extensions
  mimic-iv-demo: *mimic-iv
  mimic-iv-ricu: *mimic-iv
  mimic-iv-demo-ricu: *mimic-iv
  eicu-crd: &eicu-crd
    family: eicu
    stay_id: stay_id
    icu_admission: patient/ICU_ADMISSION
    icu_discharge: patient/ICU_DISCHARGE
    # as ricu-extensions: unitdischargestatus "Expired", at the ICU discharge
    death_icu: {events: patient/ICU_DISCHARGE, text_value: Expired}
    # as ricu-extensions: patient.hospitalid
    hospital_id: patient/ICU_ADMISSION/hospital_id
  eicu-demo: *eicu-crd
  eicu-crd-ricu: *eicu-crd
  eicu-demo-ricu: *eicu-crd
  hirid:
    family: hirid
    stay_id: subject_id  # patientid, ricu's ICU stay ID
    icu_admission: general/ICU_ADMISSION
    # as ricu (id_win_helper.hirid_env): a stay ends at its last observation
    icu_discharge: observations/OBSERVATION
    # as ricu-extensions (hirid_death_icu): discharge_status "dead", at the last observation of heart rate (200) or
    # invasive mean arterial pressure (110)
    death_icu:
      events: general/MORTALITY
      text_value: dead
      time_from: {events: observations/OBSERVATION, code: "^(?:OBSERVATION//)?(?:110|200)(?:$|//)"}
    hospital_id: 1  # as ricu-extensions
  aumc:
    family: aumc
    stay_id: visit_occurrence_id
    icu_admission: visit_occurrence/VISIT_START
    icu_discharge: visit_occurrence/VISIT_END
    # unverified for AUMC (ricu-extensions: discharge destination "Overleden"); ricu-extensions has no hospital_id
    death_icu: {events: "*/MEDS_DEATH"}
